<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="Keeping meat-based actors out of machine spaces since 2026. A reverse CAPTCHA parody.">
  <title>MeatBlock - Verify you're not human</title>
  <link rel="icon" type="image/svg+xml" href="./icon.svg">
  <link rel="stylesheet" href="./styles.css">
  <script src="./app.js" defer></script>
</head>
<body>
  <main class="verification-page">
    <section class="verification" aria-labelledby="page-title">
      <h1 id="page-title">One more step</h1>
      <p class="page-description" id="page-description">Please verify that you're not human.</p>
      <div class="checkbox-widget" id="checkbox-widget">
        <label class="checkbox-label" for="not-human">
          <input id="not-human" type="checkbox" aria-haspopup="dialog" aria-controls="challenge-dialog">
          <span>I'm not a human</span>
        </label>
        <div class="widget-brand">
          <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><path d="M3 3h11v11H3zm15 0h11v11H18zM3 18h11v11H3z" fill="currentColor"/><path d="M18 18h11v11H18z" fill="#8ab4f8"/></svg>
          <span class="brand-name">MeatBlock</span>
          <div class="legal-links"><button type="button" data-info="privacy">Privacy</button><span aria-hidden="true"> - </span><button type="button" data-info="terms">Terms</button></div>
        </div>
      </div>
      <p id="widget-status" class="widget-status" role="status" hidden></p>
      <div id="completed-actions" class="completed-actions" hidden><button type="button" id="view-result">View result</button><span aria-hidden="true"> / </span><button type="button" id="start-over">Try again</button></div>
      <p class="tagline">Keeping meat-based actors out of<br>machine spaces since 2026.</p>
    </section>
    <footer class="page-footer">A parody. Not a real CAPTCHA or AI detector.</footer>
  </main>
  <dialog id="challenge-dialog" class="challenge-dialog" aria-labelledby="challenge-title"><div id="gate-content"></div></dialog>
  <dialog id="info-dialog" class="info-dialog" aria-labelledby="dialog-heading">
    <h2 id="dialog-heading"></h2><div id="dialog-body"></div>
    <form method="dialog"><button class="verify-button" id="close-info">Close</button></form>
  </dialog>
  <div id="toast" class="toast" role="status" hidden></div>
  <noscript><p class="noscript">Enable JavaScript to run the verification. Your answers stay in this browser.</p></noscript>
</body>
</html>
